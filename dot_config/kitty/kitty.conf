
font_family      JetBrainsMono Nerd Font
font_size        15
bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 1.0
window_padding_width 0

# hand ctrl backspace, especially for nvim
map ctrl+backspace send_text all \x17

